<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookshelf API</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm">

    <div class="mb-6 text-center">
      <p class="text-2xl font-bold text-gray-800 tracking-wide">BOOKSHELF API LOGIN</p>
    </div>

    <section class="space-y-4">
      <div>
        <input 
          type="text" 
          id="name" 
          placeholder="Username"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
        >
      </div>

      <div>
        <input 
          type="password" 
          id="pass" 
          placeholder="Password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
        >
      </div>
    </section>

    <div class="mt-6">
      <button class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 rounded-lg transition duration-200">
        Login
      </button>
    </div>

    <p class="text-center text-sm text-gray-500 mt-4">
      Don't have an account? 
      <a href="Signup.html" class="text-blue-500 hover:underline font-medium">Sign up</a>
    </p>

  </div>

</body>
</html>
